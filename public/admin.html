<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniGo Admin</title><style>
:root{--g:#08783e;--d:#064d2b;--y:#ffd43b}*{box-sizing:border-box}body{margin:0;background:#f4f8f3;color:#172018;font-family:system-ui,Arial,sans-serif}
header{background:linear-gradient(120deg,var(--d),var(--g));color:white;padding:20px;border-bottom:5px solid var(--y)}
.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce7dc;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #173d1a0c}
h1,h2{margin-top:0}.muted{color:#68756a;font-size:.9rem}label{display:block;font-weight:700;margin:12px 0 5px}
input,textarea{width:100%;padding:12px;border:1px solid #ccd8cc;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:var(--g);color:white;font-weight:800;cursor:pointer}button.secondary{background:#e8f1e8;color:#17351f}button.danger{background:#b3261e}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1eb}.item img{width:64px;height:64px;object-fit:cover;border-radius:10px}.item .grow{flex:1;min-width:0}.hidden{display:none!important}.status{margin:10px 0;padding:10px;border-radius:9px;background:#eef6ee}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body>
<header><div class="wrap"><div class="topline"><div><h1>🛵 UniGo Admin</h1><div>Manage your food menu</div></div><a href="/" style="color:#ffe36a">View customer site</a></div></div></header>
<main class="wrap">
<section id="loginPanel" class="card"><h2>Admin login</h2><p class="muted">Sign in with the admin email and password configured by the website owner.</p>
<form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Log in</button></div></form></section>
<section id="dashboard" class="hidden">
<div class="topline"><h2>Admin dashboard</h2><div class="actions"><button id="showMenuBtn">Menu</button><button class="secondary" id="showOrdersBtn">Orders</button><button class="secondary" id="logoutBtn">Log out</button></div></div>
<div id="status" class="status" aria-live="polite">Ready.</div>
<div id="menuPanel"><section class="card"><h2 id="formTitle">Add food item</h2><form id="foodForm">
<input id="foodId" type="hidden"><div class="row"><div><label>Food name *</label><input id="foodName" required maxlength="100" placeholder="e.g. Pilau Special"></div><div><label>Price (KSh) *</label><input id="foodPrice" type="number" min="0" step="1" required></div></div>
<div class="row"><div><label>Emoji (optional)</label><input id="foodEmoji" maxlength="8" placeholder="🍛"></div><div><label>Food photo (optional)</label><input id="foodImage" type="file" accept="image/png,image/jpeg,image/webp"></div></div>
<label><input id="foodAvailable" type="checkbox" checked style="width:auto"> Available for customers</label>
<div class="actions"><button id="saveBtn">Save food item</button><button type="button" class="secondary" id="resetBtn">Clear form</button></div></form></section>
<section class="card"><h2>Current menu</h2><div id="menuList">Loading…</div></section></div>
<div id="ordersPanel" class="hidden"><section class="card"><div class="topline"><h2>Customer orders</h2><button class="secondary" id="refreshOrdersBtn">Refresh</button></div><div id="ordersList">Loading…</div></section></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let token=null;let menu=[];
function say(message){$("status").textContent=message}
async function request(path,options={}){const headers={...(options.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch("/api"+path,{...options,headers});const data=await r.json().catch(()=>({error:"Unexpected server response"}));if(!r.ok)throw new Error(data.error||"Request failed");return data}
function showDashboard(){ $("loginPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");showMenu();loadMenu()}
function showMenu(){ $("menuPanel").classList.remove("hidden");$("ordersPanel").classList.add("hidden");$("showMenuBtn").className="";$("showOrdersBtn").className="secondary"}
function showOrders(){ $("menuPanel").classList.add("hidden");$("ordersPanel").classList.remove("hidden");$("showOrdersBtn").className="";$("showMenuBtn").className="secondary";loadOrders()}
$("showMenuBtn").onclick=showMenu;$("showOrdersBtn").onclick=showOrders;$("refreshOrdersBtn").onclick=loadOrders;
function showLogin(){ $("dashboard").classList.add("hidden");$("loginPanel").classList.remove("hidden")}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();try{const result=await request("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});token=result.token;showDashboard()}catch(err){alert(err.message)}});
$("logoutBtn").onclick=()=>{token=null;showLogin()};
$("resetBtn").onclick=resetForm;
function resetForm(){ $("foodForm").reset();$("foodId").value="";$("foodAvailable").checked=true;$("formTitle").textContent="Add food item";$("saveBtn").textContent="Save food item"}
async function loadMenu(){try{menu=await request("/admin/menu");$("menuList").innerHTML="";if(!menu.length){$("menuList").textContent="No menu items yet. Add your first food item above.";return}
menu.forEach(item=>{const el=document.createElement("div");el.className="item";const img=item.image_url?`<img src="${item.image_url}" alt="">`:`<div style="width:64px;height:64px;border-radius:10px;background:#edf5e8;display:grid;place-items:center;font-size:2rem">${item.emoji||"🍽️"}</div>`;el.innerHTML=`${img}<div class="grow"><strong></strong><div class="muted"></div><div class="muted"></div></div><div class="actions"><button class="secondary edit">Edit</button><button class="secondary toggle"></button><button class="danger delete">Delete</button></div>`;el.querySelector("strong").textContent=item.name;el.querySelectorAll(".muted")[0].textContent="KSh "+Number(item.price).toLocaleString("en-KE");el.querySelectorAll(".muted")[1].textContent=item.available?"Available":"Unavailable";el.querySelector(".toggle").textContent=item.available?"Mark unavailable":"Mark available";el.querySelector(".edit").onclick=()=>edit(item);el.querySelector(".toggle").onclick=()=>toggle(item);el.querySelector(".delete").onclick=()=>removeItem(item);$("menuList").appendChild(el)})}catch(err){say(err.message)}}
function edit(item){$("foodId").value=item.id;$("foodName").value=item.name;$("foodPrice").value=item.price;$("foodEmoji").value=item.emoji||"";$("foodAvailable").checked=!!item.available;$("formTitle").textContent="Edit food item";$("saveBtn").textContent="Update item";window.scrollTo({top:0,behavior:"smooth"})}
$("foodForm").addEventListener("submit",async e=>{e.preventDefault();try{const id=$("foodId").value;const fd=new FormData();fd.append("name",$("foodName").value.trim());fd.append("price",$("foodPrice").value);fd.append("emoji",$("foodEmoji").value.trim());fd.append("available",$("foodAvailable").checked?"true":"false");if($("foodImage").files[0])fd.append("image",$("foodImage").files[0]);await request(id?"/admin/menu/"+id:"/admin/menu",{method:id?"PUT":"POST",body:fd});say("Menu item saved.");resetForm();loadMenu()}catch(err){say(err.message)}});
async function toggle(item){try{const fd=new FormData();fd.append("name",item.name);fd.append("price",item.price);fd.append("emoji",item.emoji||"");fd.append("available",item.available?"false":"true");await request("/admin/menu/"+item.id,{method:"PUT",body:fd});loadMenu()}catch(err){say(err.message)}}
async function removeItem(item){if(!confirm("Delete "+item.name+"?"))return;try{await request("/admin/menu/"+item.id,{method:"DELETE"});say("Item deleted.");loadMenu()}catch(err){say(err.message)}}
const orderStatuses=["Received","Confirmed","Preparing","Ready for pickup","Out for delivery","Delivered","Cancelled"];
async function loadOrders(){const box=$("ordersList");box.textContent="Loading orders…";try{const orders=await request("/admin/orders");box.innerHTML="";if(!orders.length){box.textContent="No customer orders yet.";return}orders.forEach(o=>{const card=document.createElement("article");card.className="card";const title=document.createElement("h3");title.textContent=o.tracking_code+" — "+o.customer_name;const details=document.createElement("p");details.className="muted";details.textContent=`${o.phone} · ${o.area} · ${o.location} · ${new Date(o.created_at).toLocaleString()}`;const list=document.createElement("p");list.textContent=(o.items||[]).map(i=>`${i.quantity} × ${i.item_name} (KSh ${Number(i.line_total).toLocaleString()})`).join(" | ");const total=document.createElement("strong");total.textContent=`Total: KSh ${Number(o.total).toLocaleString()} · ${o.payment_method}`;const row=document.createElement("div");row.className="actions";const select=document.createElement("select");select.style.cssText="padding:10px;border:1px solid #ccd8cc;border-radius:9px;font:inherit";orderStatuses.forEach(st=>{const op=document.createElement("option");op.value=st;op.textContent=st;select.appendChild(op)});select.value=o.status;const save=document.createElement("button");save.textContent="Update status";save.onclick=async()=>{try{await request(`/admin/orders/${o.id}/status`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:select.value})});say(`Order ${o.tracking_code} updated.`);loadOrders()}catch(err){say(err.message)}};row.append(select,save);card.append(title,details,list,total,row);if(o.instructions){const note=document.createElement("p");note.className="muted";note.textContent="Instructions: "+o.instructions;card.append(note)}box.appendChild(card)})}catch(err){box.textContent=err.message;say(err.message)}}
</script></body></html>
